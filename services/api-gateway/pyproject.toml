[project]
name = "api-gateway"
version = "0.1.0"
description = "API Gateway service for EDU'NOVA backend"
requires-python = ">=3.12"
dependencies = [
    "shared",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.5.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
