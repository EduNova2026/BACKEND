[project]
name = "identity-service"
version = "0.1.0"
description = "Identity and authentication service for EDU'NOVA backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "bcrypt>=4.1.0",
    "fastapi>=0.115.0",
    "email-validator>=2.1.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.5.0",
    "pyjwt>=2.8.0",
    "redis>=5.0.0",
    "shared",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[tool.uv.sources]
shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
