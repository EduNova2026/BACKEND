[project]
name = "shared"
version = "0.1.0"
description = "Shared utilities for EDU'NOVA backend services"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
