info:
  name: List notes
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}/api/v1/scolarite/notes/?etudiant_id={{etudiant_id}}&enseignement_id={{enseignement_id}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
