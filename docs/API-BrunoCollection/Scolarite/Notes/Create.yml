info:
  name: Create note
  type: http
  seq: 2

http:
  method: POST
  url: "{{host}}/api/v1/scolarite/notes/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "etudiant_id": "{{etudiant_id}}",
        "examen_id": "{{examen_id}}",
        "valeur": 15.5,
        "absent": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
