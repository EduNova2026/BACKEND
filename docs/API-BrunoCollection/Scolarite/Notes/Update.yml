info:
  name: Update note
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{host}}/api/v1/scolarite/notes/{{note_id}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "valeur": 16,
        "absent": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
