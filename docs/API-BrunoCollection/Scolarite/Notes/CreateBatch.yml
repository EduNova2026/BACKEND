info:
  name: Create notes batch
  type: http
  seq: 3

http:
  method: POST
  url: "{{host}}/api/v1/scolarite/notes/batch"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "examen_id": "{{examen_id}}",
        "notes": [
          {
            "etudiant_id": "{{etudiant_id}}",
            "valeur": 15.5,
            "absent": false
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
