info:
  name: Create groupe
  type: http
  seq: 2

http:
  method: POST
  url: "{{host}}/api/v1/scolarite/groupes/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "nom": "Transfo",
        "promotion_id": "{{promotion_id}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
