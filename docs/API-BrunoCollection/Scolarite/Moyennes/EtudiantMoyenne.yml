info:
  name: Get etudiant moyenne
  type: http
  seq: 1

http:
  method: GET
  url: "{{host}}/api/v1/scolarite/etudiants/{{etudiant_id}}/moyenne?semestre=1"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
