info:
  name: Get promotion etudiants moyennes
  type: http
  seq: 4

http:
  method: GET
  url: "{{host}}/api/v1/scolarite/promotions/{{promotion_id}}/etudiants/moyennes?semestre=1"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
