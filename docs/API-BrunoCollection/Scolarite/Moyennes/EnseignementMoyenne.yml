info:
  name: Get enseignement moyenne
  type: http
  seq: 3

http:
  method: GET
  url: "{{host}}/api/v1/scolarite/enseignements/{{enseignement_id}}/moyenne?semestre=1"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
