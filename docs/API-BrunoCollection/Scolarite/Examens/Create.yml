info:
  name: Create examen
  type: http
  seq: 2

http:
  method: POST
  url: "{{host}}/api/v1/scolarite/examens/"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "enseignement_id": "{{enseignement_id}}",
        "nom": "Contrôle continu 1",
        "type": "examen",
        "coefficient": 1,
        "note_max": 20
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
