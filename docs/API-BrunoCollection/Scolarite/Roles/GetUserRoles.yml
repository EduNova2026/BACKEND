info:
  name: Get user roles
  type: http
  seq: 2

http:
  method: GET
  url: "{{host}}/api/v1/scolarite/roles/utilisateurs/{{utilisateur_id}}/roles"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
