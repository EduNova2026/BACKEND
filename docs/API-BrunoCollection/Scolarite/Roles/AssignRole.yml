info:
  name: Assign role
  type: http
  seq: 3

http:
  method: POST
  url: "{{host}}/api/v1/scolarite/roles/utilisateurs/{{utilisateur_id}}/roles"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "role_id": "{{role_id}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
