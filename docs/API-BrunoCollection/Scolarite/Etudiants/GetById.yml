info:
  name: Get etudiant by id
  type: http
  seq: 3

http:
  method: GET
  url: "{{host}}/api/v1/scolarite/etudiants/{{etudiant_id}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
