info:
  name: Unassign etudiant from groupe
  type: http
  seq: 10

http:
  method: DELETE
  url: "{{host}}/api/v1/scolarite/etudiants/{{etudiant_id}}/groupes/{{groupe_id}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
