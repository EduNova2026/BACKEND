info:
  name: Update etudiant
  type: http
  seq: 4

http:
  method: PATCH
  url: "{{host}}/api/v1/scolarite/etudiants/{{etudiant_id}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "nom": "Dupont",
        "prenom": "Elodie",
        "promotion_id": "{{promotion_id}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
