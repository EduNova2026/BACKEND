info:
  name: Assign enseignant groupe
  type: http
  seq: 1

http:
  method: POST
  url: "{{host}}/api/v1/scolarite/groupes/{{groupe_id}}/enseignants/{{enseignant_id}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
