info:
  name: List enseignants by groupe
  type: http
  seq: 2

http:
  method: GET
  url: "{{host}}/api/v1/scolarite/groupes/{{groupe_id}}/enseignants"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
