info:
  name: List groupes by enseignant
  type: http
  seq: 4

http:
  method: GET
  url: "{{host}}/api/v1/scolarite/enseignants/{{enseignant_id}}/groupes"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
