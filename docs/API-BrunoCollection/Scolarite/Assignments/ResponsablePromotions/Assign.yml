info:
  name: Assign responsable promotion
  type: http
  seq: 1

http:
  method: POST
  url: "{{host}}/api/v1/scolarite/promotions/{{promotion_id}}/responsables/{{responsable_id}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
