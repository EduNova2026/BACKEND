info:
  name: List promotions by responsable
  type: http
  seq: 4

http:
  method: GET
  url: "{{host}}/api/v1/scolarite/responsables/{{responsable_id}}/promotions"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
