info:
  name: Activation utilisateur
  type: http
  seq: 1

http:
  method: PATCH
  url: "{{host}}/api/v1/scolarite/utilisateurs/{{utilisateur_id}}/activation"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "actif": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5