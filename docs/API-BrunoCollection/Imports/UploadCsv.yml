info:
  name: Upload notes CSV
  type: http
  seq: 3

http:
  method: POST
  url: "{{host}}/api/v1/imports/upload?enseignement_id={{enseignement_id}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: multipartForm
    data:
      - name: file
        value: notes.csv
        type: file
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
