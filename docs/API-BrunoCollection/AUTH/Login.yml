info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: "{{host}}/api/v1/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "password": "{{passwd}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
